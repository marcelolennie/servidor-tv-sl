<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SL TV Sync - Dashboard</title>
  <style>
    :root {
      --bg: #0b0f19;
      --panel: #151b2b;
      --panel-2: #1e2538;
      --accent: #00d4ff;
      --accent-2: #7c3aed;
      --danger: #ef4444;
      --success: #22c55e;
      --warning: #f59e0b;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --border: #2d3748;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 0;
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    header {
      padding: 20px 28px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--panel);
      position: sticky;
      top: 0; z-index: 10;
    }
    header h1 { margin: 0; font-size: 22px; font-weight: 700; }
    header h1 span { color: var(--accent); }
    .badge {
      background: #1e293b;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 12px;
      color: var(--muted);
      border: 1px solid var(--border);
    }
    .container {
      max-width: 1280px;
      margin: 0 auto;
      padding: 28px;
    }
    .grid {
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap: 24px;
    }
    @media (max-width: 900px) {
      .grid { grid-template-columns: 1fr; }
    }
    .card {
      background: var(--panel);
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.35);
      border: 1px solid var(--border);
    }
    .card h2 { margin: 0 0 18px 0; font-size: 16px; color: var(--accent); text-transform: uppercase; letter-spacing: 0.8px; }
    .form-group { margin-bottom: 18px; }
    label { display: block; margin-bottom: 6px; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.6px; font-weight: 600; }
    input, select, textarea {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      transition: border-color 0.15s;
    }
    input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); }
    textarea { min-height: 80px; resize: vertical; font-family: inherit; }
    .btn-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
    button {
      border: none;
      border-radius: 10px;
      padding: 12px 18px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.08s, opacity 0.08s, box-shadow 0.15s;
      font-size: 13px;
      display: inline-flex; align-items: center; gap: 6px;
    }
    button:hover { transform: translateY(-1px); opacity: 0.92; }
    button:active { transform: translateY(0); }
    .primary { background: linear-gradient(135deg, var(--accent), #0099cc); color: #000; box-shadow: 0 4px 14px rgba(0,212,255,0.25); }
    .success { background: var(--success); color: #000; }
    .warning { background: var(--warning); color: #000; }
    .danger { background: var(--danger); color: #fff; }
    .ghost { background: transparent; border: 1px solid var(--border); color: var(--text); }
    .status {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
      padding: 14px;
      background: var(--bg);
      border-radius: 12px;
    }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--success); box-shadow: 0 0 8px var(--success); }
    .dot.off { background: var(--danger); box-shadow: 0 0 8px var(--danger); }
    .meta { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
    .meta-item { background: var(--bg); padding: 10px 14px; border-radius: 10px; font-size: 13px; color: var(--muted); border: 1px solid var(--border); }
    .meta-item strong { color: var(--text); margin-left: 4px; }
    .logs {
      background: var(--bg);
      border-radius: 12px;
      padding: 14px;
      font-family: 'Fira Code', monospace;
      font-size: 12px;
      max-height: 240px;
      overflow-y: auto;
      border: 1px solid var(--border);
    }
    .log-line { margin-bottom: 6px; color: var(--muted); }
    .log-line strong { color: var(--accent); }
    .player-preview {
      width: 100%;
      aspect-ratio: 16/9;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      margin-top: 12px;
      border: 1px solid var(--border);
    }
    .player-preview iframe { width: 100%; height: 100%; border: none; }
    .url-grid { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: end; }
    .playlist { list-style: none; padding: 0; margin: 0; max-height: 220px; overflow-y: auto; }
    .playlist li {
      display: flex; justify-content: space-between; align-items: center;
      padding: 10px 12px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      margin-bottom: 8px;
      font-size: 13px;
    }
    .playlist li.active { border-color: var(--accent); background: rgba(0,212,255,0.08); }
    .playlist button { padding: 6px 10px; font-size: 11px; }
    .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .seek-row { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: end; }
    .section-title { font-size: 13px; color: var(--muted); margin-bottom: 8px; font-weight: 600; }
  </style>
</head>
<body>
  <header>
    <h1>SL TV <span>Sync</span></h1>
    <div class="badge" id="conn-badge">Disconnected</div>
  </header>

  <div class="container">
    <div class="grid">
      <div class="card">
        <h2>Now Playing</h2>
        <div class="status">
          <div class="dot off" id="status-dot"></div>
          <div id="status-text">Waiting for content...</div>
        </div>
        <div class="meta">
          <div class="meta-item">Channel<strong id="meta-channel">main-living-room</strong></div>
          <div class="meta-item">Viewers<strong id="meta-viewers">0</strong></div>
          <div class="meta-item">Volume<strong id="meta-volume">80%</strong></div>
        </div>

        <div class="form-group">
          <label>Title</label>
          <input type="text" id="title" placeholder="Video title" />
        </div>
        <div class="form-group">
          <label>Source URL</label>
          <div class="url-grid">
            <input type="text" id="url" placeholder="https://www.youtube.com/embed/..." />
            <select id="source-type">
              <option value="youtube">YouTube</option>
              <option value="direct">Direct MP4</option>
              <option value="html5">HTML5</option>
            </select>
          </div>
        </div>
        <div class="btn-row">
          <button class="primary" onclick="sendAction('change')">▶ Load & Play</button>
          <button class="success" onclick="sendAction('play')">Play</button>
          <button class="warning" onclick="sendAction('pause')">Pause</button>
          <button class="danger" onclick="sendAction('stop')">Stop</button>
        </div>
      </div>

      <div class="card">
        <h2>Playback</h2>
        <div class="form-group">
          <label>Seek Position (seconds)</label>
          <div class="seek-row">
            <input type="number" id="seek-pos" value="0" min="0" />
            <button class="primary" onclick="sendAction('seek')">Seek</button>
          </div>
        </div>
        <div class="form-group">
          <label>Volume</label>
          <input type="range" id="volume" min="0" max="100" value="80" />
        </div>
        <div class="btn-row">
          <button class="ghost" onclick="sendAction('prev')">⏮ Prev</button>
          <button class="ghost" onclick="sendAction('next')">⏭ Next</button>
        </div>
      </div>

      <div class="card">
        <h2>Playlist</h2>
        <div class="form-group">
          <label>Add to playlist</label>
          <div class="two-col">
            <input type="text" id="pl-url" placeholder="URL" />
            <input type="text" id="pl-title" placeholder="Title" />
          </div>
        </div>
        <div class="btn-row">
          <button class="primary" onclick="addToPlaylist()">+ Add</button>
          <button class="danger" onclick="sendAction('clear')">Clear All</button>
        </div>
        <div class="section-title" style="margin-top:18px">Up next</div>
        <ul class="playlist" id="playlist"></ul>
      </div>

      <div class="card">
        <h2>Channel & Preview</h2>
        <div class="form-group">
          <label>Channel ID</label>
          <input type="text" id="channel-id" value="main-living-room" />
        </div>
        <div class="form-group">
          <label>Admin Secret</label>
          <input type="password" id="secret" placeholder="Your secret" />
        </div>
        <div class="btn-row">
          <button class="primary" onclick="saveSettings()">Save Settings</button>
          <button class="ghost" onclick="openTvUrl()">Open TV URL</button>
        </div>
        <div class="player-preview">
          <iframe id="preview-frame" src=""></iframe>
        </div>
      </div>
    </div>

    <div class="card" style="margin-top:24px">
      <h2>Event Log</h2>
      <div class="logs" id="logs"></div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    let secret = localStorage.getItem('sltv-secret') || '';
    document.getElementById('secret').value = secret;

    const socket = io({ transports: ['websocket', 'polling'] });
    const badge = document.getElementById('conn-badge');
    const dot = document.getElementById('status-dot');
    const statusText = document.getElementById('status-text');
    const logs = document.getElementById('logs');

    function log(msg) {
      const line = document.createElement('div');
      line.className = 'log-line';
      const t = new Date().toLocaleTimeString();
      line.innerHTML = `<strong>[${t}]</strong> ${msg}`;
      logs.prepend(line);
      if (logs.children.length > 60) logs.lastChild.remove();
    }

    function saveSettings() {
      secret = document.getElementById('secret').value;
      localStorage.setItem('sltv-secret', secret);
      const ch = document.getElementById('channel-id').value;
      socket.emit('join', ch);
      log('Settings saved, joined channel: ' + ch);
    }

    function getPayload(action) {
      const payload = {
        secret,
        action,
        channelId: document.getElementById('channel-id').value,
        title: document.getElementById('title').value,
        volume: parseInt(document.getElementById('volume').value, 10)
      };

      if (action === 'change') {
        payload.url = document.getElementById('url').value;
        payload.sourceType = document.getElementById('source-type').value;
      }
      if (action === 'seek') {
        payload.position = parseFloat(document.getElementById('seek-pos').value) || 0;
      }
      if (action === 'play') {
        payload.position = parseFloat(document.getElementById('seek-pos').value) || 0;
      }

      return payload;
    }

    function sendAction(action) {
      const payload = getPayload(action);
      socket.emit('admin:control', payload);
      log(`Sent ${action}` + (payload.title ? ` - ${payload.title}` : ''));
    }

    function addToPlaylist() {
      const url = document.getElementById('pl-url').value;
      const title = document.getElementById('pl-title').value;
      if (!url) { alert('URL required'); return; }
      socket.emit('admin:control', {
        secret,
        action: 'add',
        channelId: document.getElementById('channel-id').value,
        url,
        title,
        sourceType: document.getElementById('source-type').value
      });
      document.getElementById('pl-url').value = '';
      document.getElementById('pl-title').value = '';
      log('Added to playlist: ' + title);
    }

    function removeFromPlaylist(index) {
      socket.emit('admin:control', {
        secret,
        action: 'remove',
        channelId: document.getElementById('channel-id').value,
        index
      });
      log('Removed item ' + index);
    }

    function openTvUrl() {
      const ch = document.getElementById('channel-id').value;
      const url = `${location.origin}/?channel=${encodeURIComponent(ch)}`;
      window.open(url, '_blank');
    }

    function renderPlaylist(state) {
      const list = document.getElementById('playlist');
      list.innerHTML = '';
      state.playlist.forEach((item, i) => {
        const li = document.createElement('li');
        if (i === state.currentIndex) li.classList.add('active');
        li.innerHTML = `<div>${i + 1}. ${item.title || 'Untitled'}</div>
          <button class="danger" onclick="removeFromPlaylist(${i})">✕</button>`;
        list.appendChild(li);
      });
    }

    function renderPreview(url, sourceType) {
      const isYT = sourceType === 'youtube' || url.includes('youtube.com');
      const frame = document.getElementById('preview-frame');
      if (isYT) {
        const u = new URL(url, location.href);
        u.searchParams.set('autoplay', '0');
        u.searchParams.set('controls', '1');
        u.searchParams.set('mute', '1');
        frame.src = u.toString();
      } else {
        frame.src = url;
      }
    }

    socket.on('connect', () => {
      badge.textContent = 'Connected';
      badge.style.background = '#064e3b';
      badge.style.color = '#34d399';
      const ch = document.getElementById('channel-id').value;
      socket.emit('join', ch);
      log('Connected to server');
    });

    socket.on('disconnect', () => {
      badge.textContent = 'Disconnected';
      badge.style.background = '#450a0a';
      badge.style.color = '#fca5a5';
      log('Disconnected from server');
    });

    socket.on('tv:update', (state) => {
      document.getElementById('title').value = state.title || '';
      document.getElementById('url').value = state.url || '';
      document.getElementById('source-type').value = state.sourceType || 'youtube';
      document.getElementById('seek-pos').value = Math.floor(state.position || 0);
      document.getElementById('volume').value = state.volume || 80;
      document.getElementById('channel-id').value = state.channelId || 'main-living-room';
      document.getElementById('meta-channel').textContent = state.channelId || 'main-living-room';
      document.getElementById('meta-viewers').textContent = state.viewers || 0;
      document.getElementById('meta-volume').textContent = (state.volume || 80) + '%';

      dot.classList.toggle('off', !state.isPlaying);
      statusText.textContent = state.isPlaying
        ? `Playing: ${state.title || 'Untitled'}`
        : `Paused: ${state.title || 'Untitled'}`;

      renderPlaylist(state);
      renderPreview(state.url, state.sourceType);

      log(`State: ${state.title} · ${state.isPlaying ? 'playing' : 'paused'} · ${state.viewers || 0} viewers`);
    });

    socket.on('error', (msg) => log(`Error: ${msg}`));

    fetch('/api/state')
      .then(r => r.json())
      .then(state => {
        document.getElementById('title').value = state.title || '';
        document.getElementById('url').value = state.url || '';
        document.getElementById('source-type').value = state.sourceType || 'youtube';
        document.getElementById('seek-pos').value = Math.floor(state.position || 0);
        document.getElementById('volume').value = state.volume || 80;
      })
      .catch(() => log('Could not fetch initial state'));
  </script>
</body>
</html>
