<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arosani MediaSL - Smart OS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#0F171E',
                        secondary: '#1A242F',
                        accent: '#00A8E1',
                        textMuted: '#8197A4'
                    }
                }
            }
        }
    </script>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #0F171E; }
        #player-container { position: absolute; inset: 0; z-index: 1; pointer-events: none; }
        #ui-layer { position: relative; z-index: 10; height: 100%; overflow-y: auto; background: rgba(15, 23, 30, 0.45); backdrop-filter: blur(8px); transition: opacity 0.3s; }
        .hide-ui #ui-layer { opacity: 0; pointer-events: none; } /* Esconde o menu se o mouse ficar parado */
    </style>
</head>
<body class="text-white font-sans antialiased" onmousemove="resetTimer()">

    <!-- 1. PLAYER DO YOUTUBE (O VÍDEO EM SI) -->
    <div id="player-container">
        <div id="player" class="w-full h-full"></div>
    </div>

    <!-- 2. INTERFACE DASHBOARD (UI) -->
    <div id="ui-layer" class="flex flex-col justify-between p-6 lg:p-10">
        
        <!-- HEADER: Logo, Status do Sincronismo e Idiomas -->
        <header class="flex justify-between items-center bg-secondary/80 p-4 rounded-xl border border-gray-800">
            <div class="flex items-center gap-3">
                <i class="fas fa-tv text-accent text-2xl"></i>
                <span class="font-bold text-xl tracking-wide">AVEN <span class="text-accent">SX</span></span>
                <span id="sync-status" class="ml-4 text-xs bg-green-500/20 text-green-400 border border-green-500/30 px-2 py-1 rounded flex items-center gap-1">
                    <i class="fas fa-wifi text-[10px]"></i> <span data-i18n="connected">Sincronizado</span>
                </span>
            </div>

            <!-- SELETOR DE IDIOMAS (PT, EN, ES) -->
            <div class="flex items-center gap-2 bg-primary/80 p-1 rounded-lg border border-gray-700">
                <button onclick="changeLanguage('pt')" class="px-2 py-1 text-xs font-bold rounded hover:bg-accent transition" id="lang-pt">PT</button>
                <button onclick="changeLanguage('en')" class="px-2 py-1 text-xs font-bold text-textMuted rounded hover:bg-accent transition" id="lang-en">EN</button>
                <button onclick="changeLanguage('es')" class="px-2 py-1 text-xs font-bold text-textMuted rounded hover:bg-accent transition" id="lang-es">ES</button>
            </div>
        </header>

        <!-- BARRA DE CONTROLE E BUSCA RÁPIDA (CENTRAL) -->
        <main class="my-auto max-w-3xl w-full mx-auto space-y-6">
            
            <div class="text-center space-y-2">
                <h1 class="text-3xl font-bold tracking-tight" data-i18n="title">O que vamos assistir agora?</h1>
                <p class="text-textMuted text-sm" data-i18n="subtitle">Cole o link do YouTube para tocar simultaneamente para todos na sala.</p>
            </div>

            <!-- CAMPO DE LINK / BUSCA -->
            <div class="flex gap-2 bg-secondary p-2 rounded-xl border border-gray-700 shadow-2xl">
                <input type="text" id="videoUrl" placeholder="https://www.youtube.com/watch?v=..." class="flex-1 bg-primary text-white px-4 py-3 rounded-lg outline-none border border-transparent focus:border-accent transition text-sm" data-i18n-ph="placeholder">
                <button onclick="sendNewVideo()" class="bg-accent hover:bg-accent/80 text-white font-bold px-6 py-3 rounded-lg transition flex items-center gap-2">
                    <i class="fas fa-play"></i> <span data-i18n="playBtn">Tocar</span>
                </button>
            </div>

            <!-- BOTOES DE AÇÃO (PLAY, PAUSE, SYNC) -->
            <div class="flex justify-center gap-4">
                <button onclick="sendTogglePlay()" class="bg-white hover:bg-gray-200 text-black font-bold px-8 py-3 rounded-lg flex items-center gap-2 transition transform hover:scale-105">
                    <i class="fas fa-pause-play" id="playIcon"></i> <span id="playText" data-i18n="pauseBtn">Play / Pause</span>
                </button>
            </div>
        </main>

        <!-- FOOTER: INFORMAÇÕES DA SALA -->
        <footer class="flex justify-between items-center text-xs text-textMuted bg-secondary/60 p-3 rounded-lg">
            <div><span data-i18n="roomLabel">ID da Sala (UUID SL):</span> <strong id="roomIdDisplay" class="text-white">Carregando...</strong></div>
            <div>MediaSL Engine v2.0</div>
        </footer>
    </div>

    <!-- SOCKET.IO E LÓGICA DE SINCRONISMO -->
    <script src="/socket.io/socket.io.js"></script>
    <script>
        // 1. DICIONÁRIO DE IDIOMAS (PT, EN, ES)
        const translations = {
            pt: {
                connected: "Sincronizado",
                title: "O que vamos assistir agora?",
                subtitle: "Cole o link do YouTube para tocar simultaneamente para todos na sala.",
                placeholder: "Cole o link do YouTube aqui...",
                playBtn: "Tocar",
                pauseBtn: "Play / Pause",
                roomLabel: "ID da Sala (UUID SL):"
            },
            en: {
                connected: "Synced",
                title: "What are we watching today?",
                subtitle: "Paste the YouTube link to play simultaneously for everyone in the room.",
                placeholder: "Paste YouTube link here...",
                playBtn: "Play",
                pauseBtn: "Play / Pause",
                roomLabel: "Room ID (SL UUID):"
            },
            es: {
                connected: "Sincronizado",
                title: "¿Qué vamos a ver hoy?",
                subtitle: "Pega el enlace de YouTube para reproducirlo simultáneamente para todos.",
                placeholder: "Pega el enlace de YouTube aquí...",
                playBtn: "Reproducir",
                pauseBtn: "Play / Pausa",
                roomLabel: "ID de Sala (SL UUID):"
            }
        };

        let currentLang = 'pt';

        function changeLanguage(lang) {
            currentLang = lang;
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (translations[lang][key]) el.innerText = translations[lang][key];
            });
            document.querySelectorAll('[data-i18n-ph]').forEach(el => {
                const key = el.getAttribute('data-i18n-ph');
                if (translations[lang][key]) el.placeholder = translations[lang][key];
            });
            
            // Destaca o botão ativo
            ['pt','en','es'].forEach(l => {
                const btn = document.getElementById(`lang-${l}`);
                if(l === lang) {
                    btn.className = "px-2 py-1 text-xs font-bold rounded bg-accent text-white";
                } else {
                    btn.className = "px-2 py-1 text-xs font-bold text-textMuted rounded hover:bg-accent transition";
                }
            });
        }

        // Auto-detecta o idioma do navegador do cliente SL
        const userLang = window.navigator.language || window.navigator.userLanguage;
        if (userLang.startsWith('es')) changeLanguage('es');
        else if (!userLang.startsWith('pt')) changeLanguage('en');

        // 2. SINCRONISMO EM TEMPO REAL (SOCKET.IO)
        const urlParams = new URLSearchParams(window.location.search);
        const roomId = urlParams.get('room') || 'tv-demo';
        document.getElementById('roomIdDisplay').innerText = roomId;

        const socket = io();
        let player;
        let isReady = false;
        let currentVideoId = '';
        let isPlaying = false;

        // API do YouTube
        const tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        document.head.appendChild(tag);

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                height: '100%', width: '100%',
                videoId: 'dQw4w9WgXcQ',
                playerVars: { 'controls': 0, 'disablekb': 1, 'rel': 0 },
                events: { 'onReady': () => { isReady = true; socket.emit('joinRoom', roomId); } }
            });
        }

        socket.on('sync', (data) => {
            if (!isReady) return;

            if (data.currentVideoId !== currentVideoId) {
                currentVideoId = data.currentVideoId;
                player.loadVideoById(currentVideoId, data.currentTime);
            } else {
                const tempoTela = player.getCurrentTime() || 0;
                if (Math.abs(tempoTela - data.currentTime) > 2) {
                    player.seekTo(data.currentTime);
                }
            }

            if (data.isPlaying && !isPlaying) player.playVideo();
            else if (!data.isPlaying && isPlaying) player.pauseVideo();
            
            isPlaying = data.isPlaying;
        });

        function sendNewVideo() {
            const url = document.getElementById('videoUrl').value;
            let videoId = '';
            if (url.includes('v=')) videoId = url.split('v=')[1].substring(0,11);
            else if (url.includes('youtu.be/')) videoId = url.split('youtu.be/')[1].substring(0,11);

            if (videoId) {
                socket.emit('command', { roomId: roomId, action: 'changeVideo', videoId: videoId });
                document.getElementById('videoUrl').value = '';
            }
        }

        function sendTogglePlay() {
            const acao = isPlaying ? 'pause' : 'play';
            socket.emit('command', { roomId: roomId, action: acao, time: player.getCurrentTime() });
        }

        // Esconde o menu (UI) quando o mouse fica parado para o vídeo ocupar 100% da TV
        let timeout;
        function resetTimer() {
            document.body.classList.remove('hide-ui');
            clearTimeout(timeout);
            timeout = setTimeout(() => { document.body.classList.add('hide-ui'); }, 4000);
        }
    </script>
</body>
</html>
