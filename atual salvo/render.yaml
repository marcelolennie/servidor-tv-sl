services:
  - type: web
    name: sl-tv-sync
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: ADMIN_SECRET
        generateValue: true
        # Ou defina um valor fixo: value: "marcelodamiaosenha"
    healthCheckPath: /health
